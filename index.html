<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>One More</title>
<style>
  :root {
    --bg: #15120f;
    --bg-glow: #2a1d14;
    --ink: #f3e9dc;
    --muted: #8a7b6b;
    --red: #ff4b3e;
    --red-hi: #ff8a6b;
    --red-lo: #a3170f;
    --red-edge: #6e0c06;
    --dead: #4a423b;
    --dead-edge: #2a2521;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(120% 80% at 50% 40%, var(--bg-glow), var(--bg) 70%);
    background-color: var(--bg);
    color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif;
    display: grid;
    place-items: center;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  canvas#fx { position: fixed; inset: 0; pointer-events: none; }

  .stage {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
    padding: 16px;
  }
  header { text-align: center; transition: opacity 500ms ease, filter 500ms ease; }
  header.gone { opacity: 0; filter: blur(4px); }
  h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .tagline { margin: 6px 0 0; font-size: 13px; color: var(--muted); opacity: 0.6; }

  .count {
    position: relative;
    font-size: clamp(88px, 22vw, 160px);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    letter-spacing: -0.04em;
    min-height: 1em;
    will-change: transform;
  }

  /* the button: a cap sitting on a darker base; pressing sinks the cap */
  .well {
    position: relative;
    width: 220px;
    height: 220px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 40%, #0b0907, #1f1914);
    box-shadow:
      inset 0 6px 14px rgba(0,0,0,0.8),
      0 1px 0 rgba(255,255,255,0.06);
    display: grid;
    place-items: center;
  }
  .btn {
    --depth: 14px;
    position: relative;
    width: 180px;
    height: 180px;
    border: 0;
    padding: 0;
    border-radius: 50%;
    cursor: pointer;
    background: transparent;
    transform: translateY(calc(var(--depth) * -1));
    transition: transform 220ms var(--ease-out);
    outline: none;
  }
  /* the edge/skirt underneath */
  .btn::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: var(--red-edge);
    transform: translateY(var(--depth));
    transition: transform 220ms var(--ease-out), background-color 400ms ease;
    box-shadow: 0 10px 24px rgba(0,0,0,0.6);
  }
  /* the cap */
  .cap {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
      radial-gradient(circle at 38% 28%, rgba(255,255,255,0.55), transparent 28%),
      radial-gradient(circle at 50% 45%, var(--red-hi), var(--red) 45%, var(--red-lo));
    box-shadow:
      inset 0 -8px 18px rgba(0,0,0,0.35),
      inset 0 4px 6px rgba(255,255,255,0.25);
    transition: filter 400ms ease, background 400ms ease;
  }
  .btn.down { transform: translateY(-2px); transition-duration: 60ms; }
  .btn.down::before { transform: translateY(2px); transition-duration: 60ms; }
  .btn.down .cap { filter: brightness(1.12); }
  .btn:focus-visible { box-shadow: 0 0 0 3px rgba(255,138,107,0.5); }

  .btn.dead { cursor: default; transform: translateY(-2px); }
  .btn.dead::before { background: var(--dead-edge); transform: translateY(2px); }
  .btn.dead .cap {
    background:
      radial-gradient(circle at 38% 28%, rgba(255,255,255,0.12), transparent 28%),
      radial-gradient(circle at 50% 45%, #5d544c, var(--dead) 50%, #2e2924);
    filter: none;
  }

  .count span { display: inline-block; will-change: transform; }
  /* red wash + aura; opacity driven from js by heat */
  .vignette {
    position: fixed; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(90% 70% at 50% 50%, transparent 40%, rgba(255, 60, 40, 0.35));
  }
  .aura {
    position: absolute; inset: -60px; border-radius: 50%; pointer-events: none; opacity: 0;
    background: radial-gradient(circle, rgba(255, 90, 60, 0.55), transparent 65%);
  }
  .ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); pointer-events: none; overflow: visible; }
  .ring circle { fill: none; stroke-width: 4; stroke-linecap: round; }
  .ring .track { stroke: rgba(138, 123, 107, 0.14); }
  .ring .fill { stroke: var(--muted); transition: stroke-dashoffset 260ms var(--ease-out), stroke 300ms ease, opacity 300ms ease; }
  .ring.close .fill { stroke: var(--red-hi); }
  .ring.past .fill { stroke: var(--red); filter: drop-shadow(0 0 6px rgba(255, 75, 62, 0.8)); }
  .flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; background: #fff; mix-blend-mode: overlay; z-index: 4; }
  .card .near { font-size: 15px; font-weight: 600; color: var(--ink); min-height: 1.4em; margin-top: 8px; }
  .history { display: flex; align-items: flex-end; justify-content: center; gap: 4px; height: 40px; margin-top: 14px; }
  .history i { display: block; width: 8px; border-radius: 3px; background: rgba(138, 123, 107, 0.35); min-height: 3px; }
  .history i.best { background: var(--red-hi); }
  .history i.now { background: var(--ink); }
  .banner {
    position: absolute; left: 50%; top: 92px; z-index: 2;
    transform: translateX(-50%);
    font-size: 13px; font-weight: 800; letter-spacing: 0.3em; text-transform: uppercase;
    color: var(--red-hi); white-space: nowrap; opacity: 0; pointer-events: none;
    text-shadow: 0 0 18px rgba(255, 90, 60, 0.7);
  }
  .shock {
    position: absolute; inset: 20px; border-radius: 50%; pointer-events: none;
    border: 2px solid rgba(255, 138, 107, 0.8);
  }
  .tiers { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 14px; max-width: 300px; }
  .tiers span {
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 4px 8px; border-radius: 999px; border: 1px solid rgba(138, 123, 107, 0.3); color: var(--muted);
  }
  .tiers span.got { color: var(--red-hi); border-color: rgba(255, 138, 107, 0.5); }
  .tiers span.fresh { background: var(--red); color: #fff; border-color: var(--red); }
  /* friends' buttons, dim and off to the side. visual only, never audible */
  .ghosts {
    position: fixed; right: -18px; top: 50%; transform: translateY(-50%); z-index: 1;
    display: flex; flex-direction: column; gap: 26px; pointer-events: none;
    /* fades off toward the right edge */
    -webkit-mask-image: linear-gradient(90deg, rgba(0,0,0,0.85) 20%, rgba(0,0,0,0.12));
    mask-image: linear-gradient(90deg, rgba(0,0,0,0.85) 20%, rgba(0,0,0,0.12));
  }
  .ghost { position: relative; width: 136px; text-align: center; opacity: 0.85; transition: opacity 400ms ease; pointer-events: auto; cursor: default; }
  .gtip {
    position: absolute; left: 50%; top: -30px; transform: translate(-50%, 4px); opacity: 0; pointer-events: none;
    background: var(--panel); border: 1px solid var(--panel-line); color: var(--ink);
    font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px; white-space: nowrap;
    transition: opacity 150ms ease, transform 150ms var(--ease-out);
  }
  .ghost:active .gtip { opacity: 1; transform: translate(-50%, 0); }
  @media (hover: hover) and (pointer: fine) { .ghost:hover .gtip { opacity: 1; transform: translate(-50%, 0); } }
  .ghost.hot { opacity: 1; }
  .ghost.out { opacity: 0.5; }
  .gwell {
    position: relative;
    width: 116px; height: 116px; margin: 0 auto; border-radius: 50%; display: grid; place-items: center;
    background: radial-gradient(circle at 50% 40%, #0b0907, #1f1914); box-shadow: inset 0 3px 8px rgba(0,0,0,0.8);
  }
  .gbtn { position: relative; width: 92px; height: 92px; transform: translateY(-9px); }
  .gbtn::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--red-edge); transform: translateY(9px); transition: background-color 400ms ease; }
  .gcap {
    position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle at 38% 28%, rgba(255,255,255,0.5), transparent 28%), radial-gradient(circle at 50% 45%, var(--red-hi), var(--red) 45%, var(--red-lo));
    transition: box-shadow 300ms ease;
  }
  .ghost.out .gbtn { transform: translateY(-1px); }
  .gwell .shock { inset: 8px; }
  .ghost.out .gbtn::before { background: var(--dead-edge); }
  .ghost.out .gcap { background: radial-gradient(circle at 50% 45%, #5d544c, var(--dead) 50%, #2e2924); }
  .gname { margin-top: 8px; font-size: 12px; font-weight: 600; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gct { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; display: inline-block; }
  .ghost.hot .gct { color: var(--red-hi); }
  @media (max-width: 700px) {
    .ghosts { top: auto; bottom: 12px; right: 50%; transform: translateX(50%); flex-direction: row; gap: 10px; }
    .ghosts { -webkit-mask-image: none; mask-image: none; }
    .ghost { width: 80px; opacity: 0.6; }
    .gwell { width: 68px; height: 68px; }
    .gbtn { width: 54px; height: 54px; }
    .gct { font-size: 18px; }
  }
  :root[data-theme="light"] .gwell { background: #ddd2c3; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .gwell { background: radial-gradient(circle at 50% 40%, #cbbfaf, #e2d7c8); box-shadow: inset 0 3px 8px rgba(0,0,0,0.25); } }
  canvas#void { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
  .stage { z-index: 1; }
  body { transition: background-color 600ms ease; }
  body.void { background: #000; }
  body.void .vignette { opacity: 0 !important; }
  body.void .count span {
    color: #000 !important;
    -webkit-text-stroke: 2px #fff;
    text-shadow: 0 0 2px #fff, 0 0 8px #fff, 0 0 22px #fff, 0 0 48px rgba(255,255,255,0.8), 0 0 110px rgba(255,220,180,0.6) !important;
  }
  body.void .zoomtrail { color: #fff !important; }
  /* in the void the button goes flat black and white: it can't compete with the hole, so it doesn't try */
  body.void .btn::before { background: #fff; box-shadow: none; }
  body.void .cap {
    background:
      radial-gradient(ellipse 22% 14% at 36% 26%, #fff 98%, transparent 100%),
      radial-gradient(circle at 50% 50%, #161616, #000 70%);
    box-shadow: inset 0 0 0 2px #fff;
    filter: none !important;
  }
  body.void .well { background: #000; box-shadow: 0 0 0 1px rgba(255,255,255,0.5); }
  body.void .aura { opacity: 0 !important; }
  body.void .ring .track { stroke: rgba(255,255,255,0.15); }
  body.void .ring .fill, body.void .ring.past .fill { stroke: #fff; filter: none; }
  body.void .best, body.void h1, body.void .tagline, body.void .hint { color: rgba(255,255,255,0.6); }
  .invert { position: fixed; inset: 0; pointer-events: none; background: #fff; mix-blend-mode: difference; opacity: 0; z-index: 4; }
  .megashock {
    position: fixed; width: 200px; height: 200px; margin: -100px 0 0 -100px; border-radius: 50%;
    border: 6px solid #fff; box-shadow: 0 0 40px #fff, inset 0 0 40px #fff; pointer-events: none; z-index: 3;
  }
  /* post-processing layers */
  body { perspective: 1100px; }
  .zoomtrail { position: absolute; inset: 0; text-align: center; pointer-events: none; will-change: transform, opacity; }
  .grain, .scan { position: fixed; inset: 0; pointer-events: none; opacity: 0; z-index: 3; }
  .grain { background-size: 160px 160px; mix-blend-mode: overlay; }
  .scan {
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.28) 0 1px, transparent 1px 3px);
    mix-blend-mode: multiply;
  }
  .best {
    margin-top: -28px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    transition: color 300ms ease;
  }
  .best.beating { color: var(--red-hi); }
  .hint { font-size: 13px; color: var(--muted); height: 1em; transition: opacity 300ms ease; }

  /* game over sheet */
  .over {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: grid;
    place-items: center;
    background: rgba(10, 8, 6, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 300ms ease;
  }
  .over.show { opacity: 1; pointer-events: auto; }
  .card {
    text-align: center;
    padding: 32px 36px;
    border-radius: 24px;
    background: #1d1814;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
    transform: translateY(12px) scale(0.96);
    opacity: 0;
    transition: transform 400ms var(--ease-out), opacity 300ms ease;
    max-width: calc(100vw - 32px);
  }
  .over.show .card { transform: none; opacity: 1; transition-delay: 120ms; }
  .card .label { font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
  .card .final { font-size: 72px; font-weight: 700; font-variant-numeric: tabular-nums; margin: 6px 0 2px; letter-spacing: -0.03em; }
  .card .meta { font-size: 14px; color: var(--muted); line-height: 1.6; }
  .card .meta b { color: var(--ink); font-weight: 600; }
  .card .new { color: var(--red-hi); font-weight: 600; font-size: 14px; height: 1.4em; margin-top: 6px; }
  .again {
    margin-top: 20px;
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    color: #1a0b07;
    background: var(--ink);
    border: 0;
    border-radius: 999px;
    padding: 12px 28px;
    cursor: pointer;
    transition: transform 140ms var(--ease-out);
  }
  .again:active { transform: scale(0.97); }

  .shake { animation: shake 420ms var(--ease-out); }
  @keyframes shake {
    0% { transform: translateX(0); }
    15% { transform: translateX(-10px); }
    30% { transform: translateX(8px); }
    45% { transform: translateX(-6px); }
    60% { transform: translateX(4px); }
    75% { transform: translateX(-2px); }
    100% { transform: translateX(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .shake { animation: none; }
    .card { transform: none; }
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #efe6da; --bg-glow: #fbf5ec; --ink: #241a12; --muted: #8d7a66;
    }
    :root:not([data-theme="dark"]) .well { background: radial-gradient(circle at 50% 40%, #cbbfaf, #e2d7c8); box-shadow: inset 0 6px 14px rgba(0,0,0,0.25); }
    :root:not([data-theme="dark"]) .card { background: #fbf6ef; box-shadow: 0 30px 80px rgba(60,40,20,0.25); }
    :root:not([data-theme="dark"]) .over { background: rgba(240, 230, 218, 0.5); }
    :root:not([data-theme="dark"]) .again { background: #241a12; color: #fbf6ef; }
  }
  /* ---- friends drawer ---- */
  :root { --panel: #1b1612; --panel-line: rgba(255,255,255,0.06); --field: #120f0c; --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1); }
  .drawer {
    position: fixed; top: 0; left: 0; bottom: 0; z-index: 5;
    width: min(300px, calc(100vw - 56px));
    background: var(--panel);
    border-right: 1px solid var(--panel-line);
    box-shadow: 20px 0 60px rgba(0,0,0,0.35);
    transform: translateX(-100%);
    transition: transform 380ms var(--ease-drawer);
    display: flex; flex-direction: column;
    padding: 20px 16px;
    gap: 14px;
  }
  .drawer.open { transform: none; }
  .tab {
    position: absolute; top: 50%; left: 100%;
    transform: translateY(-50%);
    width: 32px; height: 72px;
    border: 1px solid var(--panel-line); border-left: 0;
    border-radius: 0 14px 14px 0;
    background: var(--panel);
    color: var(--muted);
    cursor: pointer;
    display: grid; place-items: center;
    font: inherit; font-size: 13px; font-weight: 700;
    padding: 0;
    transition: color 200ms ease;
  }
  .tab:active { transform: translateY(-50%) scale(0.97); }
  @media (hover: hover) and (pointer: fine) { .tab:hover { color: var(--ink); } }
  .tab .chev { transition: transform 380ms var(--ease-drawer); display: block; }
  .drawer.open .tab .chev { transform: rotate(180deg); }
  .tab .badge {
    position: absolute; top: 6px; right: 5px;
    min-width: 15px; height: 15px; border-radius: 8px;
    background: var(--red); color: #fff; font-size: 10px; line-height: 15px; text-align: center;
    padding: 0 3px;
  }
  .tab .badge:empty { display: none; }
  .drawer h2 { margin: 0; font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .field {
    width: 100%; font: inherit; font-size: 15px; color: var(--ink);
    background: var(--field); border: 1px solid var(--panel-line); border-radius: 10px;
    padding: 10px 12px; outline: none;
    transition: border-color 150ms ease;
  }
  .field:focus { border-color: rgba(255,138,107,0.5); }
  .field.code { text-transform: uppercase; letter-spacing: 0.3em; font-weight: 700; text-align: center; }
  .row2 { display: flex; gap: 8px; }
  .pill {
    flex: 1; font: inherit; font-size: 14px; font-weight: 600;
    border: 0; border-radius: 10px; padding: 10px 12px; cursor: pointer;
    background: var(--ink); color: var(--panel);
    transition: transform 140ms var(--ease-out), opacity 150ms ease;
  }
  .pill.quiet { background: transparent; color: var(--muted); border: 1px solid var(--panel-line); }
  .pill:active { transform: scale(0.97); }
  .pill:disabled { opacity: 0.4; cursor: default; }
  .status { font-size: 12px; color: var(--muted); min-height: 1.3em; }
  .status b { color: var(--ink); letter-spacing: 0.15em; }
  .players { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; flex: 1; }
  .player {
    display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 10px;
    padding: 10px 12px; border-radius: 12px; background: var(--field);
    border: 1px solid var(--panel-line);
    transition: opacity 300ms ease, border-color 300ms ease;
  }
  .player .nm { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .player .nm small { color: var(--muted); font-weight: 500; margin-left: 4px; }
  .player .ct { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; grid-row: span 2; letter-spacing: -0.03em; display: inline-block; transition: color 300ms ease; }
  .player .sub { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .player.hot .ct { color: var(--red-hi); }
  .player.hot { border-color: rgba(255,90,60,0.35); }
  .player.out { opacity: 0.55; }
  .player.out .sub { color: var(--red-hi); }
  .empty { font-size: 13px; color: var(--muted); line-height: 1.5; }

  .toast {
    position: fixed; top: 16px; left: 50%; z-index: 6;
    transform: translate(-50%, -12px); opacity: 0;
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--panel-line); border-radius: 999px;
    padding: 9px 16px; font-size: 14px; font-weight: 600;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    transition: transform 300ms var(--ease-out), opacity 200ms ease;
    pointer-events: none; white-space: nowrap; max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis;
  }
  .toast::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; background: var(--muted); }
  .toast.good::before { background: #5fd38a; }
  .toast.bad::before { background: var(--red); }
  .toast.hot::before { background: #ffd36b; }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) { --panel: #fbf6ef; --panel-line: rgba(60,40,20,0.1); --field: #f1e9de; }
  }
</style>
</head>
<body>
<canvas id="void"></canvas>
<div class="vignette" id="vignette"></div>
<div class="invert" id="invert"></div>
<div class="grain" id="grain"></div>
<div class="scan" id="scan"></div>
<svg width="0" height="0" style="position:absolute"><filter id="warp"><feTurbulence id="turb" type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="1"/><feDisplacementMap in="SourceGraphic" scale="14"/></filter></svg>
<div class="flash" id="flash"></div>
<canvas id="fx"></canvas>

<aside class="drawer" id="drawer">
  <button class="tab" id="tab" aria-label="Friends"><span class="chev">&rsaquo;</span><span class="badge" id="badge"></span></button>
  <h2>Friends</h2>
  <input class="field" id="name" maxlength="16" placeholder="your name" autocomplete="off" spellcheck="false">
  <div id="joinBox" style="display:flex;flex-direction:column;gap:8px">
    <input class="field code" id="code" maxlength="6" placeholder="CODE" autocomplete="off" spellcheck="false">
    <div class="row2">
      <button class="pill" id="join">Join</button>
      <button class="pill quiet" id="create">New code</button>
    </div>
  </div>
  <button class="pill quiet" id="leave" style="display:none;flex:none">Leave room</button>
  <div class="status" id="status">same code, same room. peer to peer.</div>
  <ul class="players" id="players"></ul>
</aside>
<div class="toast" id="toast"></div>
<div class="ghosts" id="ghosts"></div>

<main class="stage" id="stage">
  <header id="title">
    <h1>One More</h1>
    <p class="tagline">Press your luck.</p>
  </header>

  <div class="banner" id="banner"></div>
  <div class="count" id="count"><span id="num">0</span></div>
  <div class="best" id="bestLive">best 0</div>

  <div class="well">
    <div class="aura" id="aura"></div>
    <svg class="ring" id="ring" viewBox="0 0 220 220"><circle class="track" cx="110" cy="110" r="104"/><circle class="fill" id="ringFill" cx="110" cy="110" r="104"/></svg>
    <button class="btn" id="btn" aria-label="Press"><span class="cap"></span></button>
  </div>

  <div class="hint" id="hint">press it. or tap space.</div>
</main>

<div class="over" id="over" aria-live="polite">
  <div class="card">
    <div class="label">that was the one</div>
    <div class="final" id="final">0</div>
    <div class="meta">
      odds on the last press: <b id="odds">0%</b><br>
      best: <b id="best">0</b>
    </div>
    <div class="new" id="newbest"></div>
    <div class="near" id="near"></div>
    <div class="tiers" id="tiers"></div>
    <div class="history" id="history"></div>
    <button class="again" id="again">One more</button>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(() => {
  // ---- the hidden part ------------------------------------------------------
  // risk is a probability in [MIN_RISK, MAX_RISK]. each press bumps it, then rolls.
  const MIN_RISK = 0.0001;   // 0.01%, never zero
  const MAX_RISK = 0.99;     // 99%, never certain
  const BIG_JUMP = 0.15;     // +15 percentage points
  const BIG_JUMP_CHANCE = 0.02;
  const tinyJump = () => 0.0001 + Math.random() * 0.0009; // +0.01% .. +0.1%

  let risk, count, alive;

  const $ = id => document.getElementById(id);
  const btn = $('btn'), countEl = $('count'), numEl = $('num'), hint = $('hint'), stage = $('stage');
  const over = $('over');

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} }
  };
  let best = parseInt(store.get('onemore.best') || '0', 10) || 0;

  const bestLive = $('bestLive');
  function showBest() {
    bestLive.textContent = 'best ' + best;
    bestLive.classList.remove('beating');
  }

  // ---- tiers: hidden layers that only exist far past your best -------------
  // each one adds a sound and a visual you've never seen until you get there
  const TIERS = [
    { at: 1,  name: 'new territory' },
    { at: 5,  name: 'heating up' },
    { at: 10, name: 'on fire' },
    { at: 20, name: 'unhinged' },
    { at: 30, name: 'absurd' },
    { at: 42, name: 'mythical' },
    { at: 55, name: 'reality bends' },
    { at: 70, name: 'event horizon' },
    { at: 90, name: 'singularity' },
    { at: 120, name: 'heat death' }
  ];
  let runTier = 0, runBest = 0, runFresh = [];
  let discovered = parseInt(store.get('onemore.tiers') || '0', 10) || 0;
  const tierAt = n => {
    if (runBest <= 0) return 0;
    const over = n - runBest;
    let t = 0;
    for (let i = 0; i < TIERS.length; i++) if (over >= TIERS[i].at) t = i + 1;
    return t;
  };

  function tierUp(t) {
    runTier = t;
    const name = TIERS[t - 1].name;
    if (t > discovered) { discovered = t; if (!debugRun) store.set('onemore.tiers', t); runFresh.push(t); }
    const b = $('banner');
    b.textContent = name;
    // sits in the title's slot (the title is faded out mid-run), clear of the number and button
    const ti = $('title');
    b.style.top = (ti.offsetTop + ti.offsetHeight / 2 - b.offsetHeight / 2) + 'px';
    b.animate([
      { opacity: 0, transform: 'translateX(-50%) translateY(8px) scale(0.92)', filter: 'blur(4px)' },
      { opacity: 1, transform: 'translateX(-50%) scale(1)', filter: 'blur(0)', offset: 0.15 },
      { opacity: 1, transform: 'translateX(-50%) scale(1)', offset: 0.75 },
      { opacity: 0, transform: 'translateX(-50%) translateY(-6px) scale(1.02)' }
    ], { duration: 1800, easing: 'cubic-bezier(0.23, 1, 0.32, 1)' });
    tierSound(t);
    spawn(40 + t * 25, 5 + t, ['#ffd36b', '#ff8a6b', '#fff1c2', '#ff4b3e'], 70, 0.03);
    if (t >= 4) startDrone();
    if (t >= 8) openVoid();
    if (t >= 9) singularity(true);
    publish('tier');
  }

  function renderTiers() {
    // only what you've found. no hint of how deep it goes
    $('tiers').innerHTML = TIERS.slice(0, discovered).map((tr, i) =>
      `<span class="${runFresh.includes(i + 1) ? 'fresh' : 'got'}">${tr.name}</span>`
    ).join('');
  }

  // per-press extras, stacking by tier
  function tierPress(t, h) {
    if (t >= 2 && !rapid) subKick();
    if (t >= 3) { if (!rapid) sparkleArp(count); shockwave(t); }
    if (t >= 5 && !rapid) whoosh();
    if (t >= 6) spawn(18, 7, ['#ff4b3e', '#ffd36b', '#6bd3ff', '#b26bff', '#6bff9e'], 80, 0.12);
    if (t === 7 && count % 4 === 0 && !reduce) $('invert').animate([{ opacity: 1 }, { opacity: 0 }], { duration: 120 });
    if (t >= 10) megaShock();
  }

  function megaShock() {
    if (reduce || document.getElementsByClassName('megashock').length > 1) return;
    const c = center(), el = document.createElement('div');
    el.className = 'megashock';
    el.style.left = c.x + 'px'; el.style.top = c.y + 'px';
    document.body.appendChild(el);
    el.animate([{ transform: 'scale(0.9)', opacity: 1 }, { transform: `scale(${Math.hypot(innerWidth, innerHeight) / 90})`, opacity: 0 }],
      { duration: 900, easing: 'cubic-bezier(0.23, 1, 0.32, 1)' }).onfinish = () => el.remove();
    $('flash').animate([{ opacity: 0.45 }, { opacity: 0 }], { duration: 300 });
  }

  function shockwave(t, host = document.querySelector('.well')) {
    if (reduce || host.getElementsByClassName('shock').length > 2) return;
    const el = document.createElement('div');
    el.className = 'shock';
    host.appendChild(el);
    el.animate([{ transform: 'scale(0.9)', opacity: 1 }, { transform: `scale(${1.6 + t * 0.15})`, opacity: 0 }],
      { duration: 600, easing: 'cubic-bezier(0.23, 1, 0.32, 1)' }).onfinish = () => el.remove();
  }

  function reset() {
    risk = MIN_RISK;
    count = 0;
    alive = true;
    numEl.getAnimations().forEach(a => a.cancel());
    numEl.textContent = '0';
    heatTarget = 0;
    frozen = false;
    runTier = 0; runBest = best; runFresh = [];
    debugRun = immortal;
    document.title = immortal ? 'One More (debug)' : 'One More';
    stopDrone();
    vignette.style.filter = '';
    closeVoid(false);
    singularity(false);
    updateRing();
    showBest();
    btn.classList.remove('dead', 'down');
    btn.disabled = false;
    over.classList.remove('show');
    hint.style.opacity = 1;
    $('title').classList.remove('gone');
    publish('reset');
  }

  let pendingDeath = null, immortal = false, debugRun = false, lastPress = 0, rapid = false;
  function press() {
    if (pendingDeath) { clearTimeout(pendingDeath.timer); const { d } = pendingDeath; pendingDeath = null; die(d); return; }
    if (!alive) return;
    const nowT = performance.now();
    rapid = nowT - lastPress < 80;
    lastPress = nowT;
    count++;
    numEl.textContent = count;
    heatTarget = heatFor(count);
    const h = heatTarget;
    if (best > 0 && count > best) {
      bestLive.textContent = 'new best';
      if (!bestLive.classList.contains('beating')) {
        bestLive.classList.add('beating');
        bestLive.animate([{ transform: 'scale(1.15)' }, { transform: 'none' }], { duration: 300, easing: 'cubic-bezier(0.23, 1, 0.32, 1)' });
      }
    }
    bump(h);
    click(count, h);
    if (count % 10 === 0) chord(0.5);      // every ten gets a little chime
    const t = tierAt(count);
    if (t > runTier) tierUp(t);
    tierPress(runTier, h);
    pressPulse = 1;
    if (runTier >= 2) zoomTrail(runTier, h);
    if (runTier >= 3) hitStopUntil = performance.now() + 30 + runTier * 6;
    const surge = Math.min(1.5, Math.max(0, count - runBest) / 70);
    burst(h, runTier, surge);
    kick(h, surge);
    updateRing();
    if (navigator.vibrate) navigator.vibrate(6);
    if (count === 1) { hint.style.opacity = 0; $('title').classList.add('gone'); }
    publish('press');

    risk += Math.random() < BIG_JUMP_CHANCE ? BIG_JUMP : tinyJump();
    risk = Math.min(MAX_RISK, Math.max(MIN_RISK, risk));

    if (!immortal && Math.random() < risk) {
      // the press lands like any other, then a beat of silence before it all goes
      // a press during the pause cuts it short
      alive = false;
      const d = drama(count);
      frozen = true;
      if (d > 0.15) tension(d);
      pendingDeath = { d, timer: setTimeout(() => { pendingDeath = null; die(d); }, 240 + d * 760) };
    }
  }

  // how hard the fall is: barely anything for a short run, operatic once you're far past your best
  function drama(n) {
    if (best > 0 && n > best) return heatFor(n);
    return Math.min(0.2, n / 150);
  }

  const ringFill = $('ringFill'), ring = $('ring');
  const CIRC = 2 * Math.PI * 104;
  ringFill.style.strokeDasharray = CIRC;
  function updateRing() {
    if (best <= 0) { ring.style.opacity = 0; return; }
    ring.style.opacity = 1;
    const prog = Math.min(1, count / best);
    ringFill.style.strokeDashoffset = CIRC * (1 - prog);
    ring.classList.toggle('close', best - count <= LEAD_IN && count <= best && count > 0);
    ring.classList.toggle('past', count > best);
  }

  function die(d = 0) {
    alive = false;
    frozen = false;
    btn.classList.add('dead');
    btn.disabled = true;
    thud(d);
    heatTarget = 0;
    stopDrone();
    if (bh) collapseVoid();
    singularity(false);
    if (navigator.vibrate) navigator.vibrate(d > 0.3 ? [60, 30, 120, 40, 200] : [30, 40, 60]);
    shakeStage(d);
    flashScreen(d);
    dropNumber(d);
    shatter(d);
    slowmo(d);

    const prevBest = best;
    const isBest = count > best;
    if (isBest && !debugRun) { best = count; store.set('onemore.best', best); }
    else if (isBest) best = count;   // debug: show it this session, never save it
    $('final').textContent = count;
    $('odds').textContent = fmtPct(risk);
    $('best').textContent = best;
    $('newbest').textContent = isBest ? (prevBest > 0 ? `new best · +${count - prevBest}` : 'new best') : '';
    $('near').textContent = nearMiss(prevBest, isBest);
    pushHistory(count);
    renderTiers();
    if (runFresh.length) $('near').textContent = 'unlocked: ' + runFresh.map(n => TIERS[n - 1].name).join(', ');
    publish('die', { odds: fmtPct(risk), record: isBest });
    setTimeout(() => { over.classList.add('show'); $('again').focus({ preventScroll: true }); }, 480 + d * 1100);
  }

  const fmtPct = p => {
    const v = p * 100;
    return (v < 1 ? v.toFixed(2) : v < 10 ? v.toFixed(1) : Math.round(v)) + '%';
  };

  // near-miss framing: tell them how close it was
  function nearMiss(prevBest, isBest) {
    let friendLine = '';
    for (const st of others.values()) {
      const gap = st.best - count;
      if (st.best > 0 && gap > 0 && gap <= 3) { friendLine = `${gap} short of ${st.name}’s best.`; break; }
    }
    if (isBest) return friendLine;
    const gap = prevBest - count;
    if (gap === 0) return 'tied your best. one more would’ve done it.';
    if (gap === 1) return '1 away from your best.';
    if (gap <= 3) return `${gap} short of your best.`;
    if (friendLine) return friendLine;
    if (prevBest > 0 && count >= prevBest * 0.75) return 'almost there.';
    return '';
  }

  let runs = [];
  try { runs = JSON.parse(store.get('onemore.runs') || '[]').slice(-14); } catch { runs = []; }
  function pushHistory(n) {
    runs.push(n); runs = runs.slice(-14);
    store.set('onemore.runs', JSON.stringify(runs));
    const max = Math.max(...runs, 1);
    const top = Math.max(...runs);
    $('history').innerHTML = runs.map((v, i) =>
      `<i class="${i === runs.length - 1 ? 'now' : v === top ? 'best' : ''}" style="height:${Math.max(3, v / max * 40)}px"></i>`
    ).join('');
  }

  function shakeStage(d) {
    if (reduce) return;
    const a = 10 + d * 34, frames = [];
    const n = 6 + Math.round(d * 10);
    for (let i = 0; i < n; i++) {
      const k = 1 - i / n;
      frames.push({ transform: `translate(${(Math.random() - 0.5) * 2 * a * k}px, ${(Math.random() - 0.5) * a * k}px) rotate(${(Math.random() - 0.5) * d * 4 * k}deg)` });
    }
    frames.push({ transform: 'none' });
    stage.animate(frames, { duration: 420 + d * 700, easing: 'ease-out' });
  }
  function flashScreen(d) {
    $('flash').animate([{ opacity: 0.25 + d * 0.65 }, { opacity: 0 }], { duration: 200 + d * 500, easing: 'cubic-bezier(0.23, 1, 0.32, 1)' });
    if (d > 0.3) vignette.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 1400, easing: 'ease-out' });
  }
  function dropNumber(d) {
    if (d < 0.15 || reduce) return;
    const dir = Math.random() < 0.5 ? -1 : 1;
    numEl.animate([
      { transform: 'none', offset: 0 },
      { transform: `translateY(-10px) rotate(${dir * 4}deg)`, offset: 0.12 },
      { transform: `translateY(${120 + d * 200}px) rotate(${dir * (15 + d * 60)}deg)`, opacity: 0, offset: 1 }
    ], { duration: 700 + d * 500, easing: 'cubic-bezier(0.5, 0, 0.9, 0.5)', fill: 'forwards' });
  }

  // ---- counter bump ---------------------------------------------------------
  function bump(h) {
    const s = 1.06 + h * 0.3, rot = (Math.random() - 0.5) * h * 16;
    numEl.animate(
      [{ transform: `translateY(${-6 - h * 14}px) scale(${s}) rotate(${rot}deg)` }, { transform: 'none' }],
      { duration: 260 + h * 120, easing: 'cubic-bezier(0.23, 1, 0.32, 1)' }
    );
  }

  // ---- heat: how close to / how far past the record you are ------------------
  // a whisper in the last few presses before the best, then it builds the further past you go
  const LEAD_IN = 4;
  function heatFor(n) {
    if (best <= 0) return 0;               // first game: nothing to chase yet
    const over = n - best;
    if (over > 0) return 0.3 + 0.7 * (1 - Math.exp(-over / 12));
    const lead = -over;                    // presses still to go
    return lead <= LEAD_IN ? 0.06 * (LEAD_IN + 1 - lead) : 0;
  }

  let heatTarget = 0, heat = 0, frozen = false;
  const vignette = $('vignette'), aura = $('aura');
  // ---- post-processing: lens, camera, film. each tier changes how the screen is *shot*, not just its colors
  let lastFilter = '', pressPulse = 0, hitStopUntil = 0, tiltX = 0, tiltY = 0, tiltTX = 0, tiltTY = 0;
  const grainEl = $('grain'), scanEl = $('scan');
  // a few frames of film grain, generated once
  const grainFrames = Array.from({ length: 4 }, () => {
    const c = document.createElement('canvas'); c.width = c.height = 160;
    const g = c.getContext('2d'), img = g.createImageData(160, 160);
    for (let i = 0; i < img.data.length; i += 4) { const v = Math.random() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
    g.putImageData(img, 0, 0);
    return `url(${c.toDataURL()})`;
  });
  let grainI = 0;

  // radial zoom blur on the number: echoes fly outward from it
  function zoomTrail(t, h) {
    if (reduce || countEl.getElementsByClassName('zoomtrail').length > 8) return;
    const n = 3 + Math.min(t, 4);
    for (let i = 0; i < n; i++) {
      const el = document.createElement('div');
      el.className = 'zoomtrail';
      el.textContent = numEl.textContent;
      el.style.color = getComputedStyle(numEl).color;
      countEl.appendChild(el);
      el.animate([
        { transform: 'scale(1)', opacity: 0.3 - i * 0.03 },
        { transform: `scale(${1.12 + i * (0.06 + h * 0.05)})`, opacity: 0 }
      ], { duration: 260 + i * 40, easing: 'cubic-bezier(0.23, 1, 0.32, 1)' }).onfinish = () => el.remove();
    }
  }

  function postFx() {
    pressPulse *= 0.86;
    if (reduce) { stage.style.filter = warping ? 'url(#warp)' : ''; return; }
    const live = alive && !frozen;
    const t = live ? runTier : 0, hh = live ? heat : 0, pp = live ? pressPulse : 0;
    const f = [];
    // the black hole (tier 8) is the climax: it gets the screen to itself, then the heavy lens
    // effects come back harder afterwards. before it, everything stays a notch below it.
    const inVoid = t === 8, post = t >= 9;
    // RGB split: a flicker on presses before the hole, a full tear after it
    const split = post ? 2 + hh * 4 + pp * 8 : inVoid ? 0 : t >= 3 ? pp * 2.5 + hh * 0.8 : 0;
    if (split > 0.3) f.push(`drop-shadow(${-split}px 0 rgba(255,0,70,0.55))`, `drop-shadow(${split}px 0 rgba(0,220,255,0.55))`);
    // lens bloom / contrast
    if (hh > 0 && !inVoid) f.push(`contrast(${1 + hh * (post ? 0.35 : 0.18)})`, `saturate(${1 + hh * 0.3})`);
    if (t >= 6 && !inVoid) f.push(`drop-shadow(0 0 ${(post ? 12 : 6) + pp * 12}px rgba(255,240,220,${post ? 0.5 : 0.3}))`);
    if (warping) f.push('url(#warp)');
    const fs = f.join(' ').replace(/(\d+\.\d)\d+/g, '$1');
    if (fs !== lastFilter) { stage.style.filter = fs; lastFilter = fs; }
    // camera: slow push-in with heat, a punch on every press, and a drifting 3D tilt from "unhinged"
    const surge = live ? Math.min(1.5, Math.max(0, count - runBest) / 70) : 0;
    // camera holds still in the void so the hole stays locked to the button
    stage.style.scale = inVoid ? 1 + pp * 0.01 : 1 + hh * 0.04 + surge * 0.03 + pp * (0.012 + hh * 0.015);
    if (post) {
      if (pp > 0.95) { tiltTX = (Math.random() - 0.5) * (4 + t); tiltTY = (Math.random() - 0.5) * (6 + t); }
    } else { tiltTX = tiltTY = 0; }
    tiltX += (tiltTX - tiltX) * 0.06; tiltY += (tiltTY - tiltY) * 0.06;
    stage.style.rotate = Math.abs(tiltX) + Math.abs(tiltY) > 0.05 ? `${tiltX.toFixed(2)} ${tiltY.toFixed(2)} 0 ${Math.hypot(tiltX, tiltY).toFixed(2)}deg` : '';
    // film grain + scanlines
    grainEl.style.opacity = inVoid ? 0 : post ? 0.16 : hh * 0.08;
    if (hh > 0) { grainI = (grainI + 1) % grainFrames.length; grainEl.style.backgroundImage = grainFrames[grainI]; }
    scanEl.style.opacity = t >= 10 ? 0.35 + Math.random() * 0.1 : 0;   // CRT only at the very end
  }

  function heatLoop() {
    postFx();
    heat += (heatTarget - heat) * 0.08;
    if (heat < 0.002) heat = 0;
    const h = reduce || frozen ? 0 : heat;
    const amp = (h * h * 7 + h * 1.5) * (bh ? 2.2 : 1) * (runTier >= 7 ? 1.4 : 1); // subtle low, unhinged high
    countEl.style.transform = h
      ? `translate(${(Math.random() - 0.5) * amp}px, ${(Math.random() - 0.5) * amp}px) rotate(${(Math.random() - 0.5) * h * 5}deg)`
      : '';
    numEl.style.color = heat ? `color-mix(in oklab, var(--ink), var(--red-hi) ${Math.round(heat * 100)}%)` : '';
    if (runTier >= 7 && alive && !reduce) {
      const o = 2 + Math.random() * 5 * heat;
      numEl.style.textShadow = `${-o}px 0 rgba(255,0,70,0.85), ${o}px 0 rgba(0,220,255,0.85), 0 0 ${heat * 48}px rgba(255, 75, 62, ${heat * 0.7})`;
    } else numEl.style.textShadow = heat ? `0 0 ${heat * 48}px rgba(255, 75, 62, ${heat * 0.7})` : '';
    if (warping) turb.setAttribute('baseFrequency', (0.01 + Math.sin(performance.now() / 400) * 0.004).toFixed(4));
    vignette.style.opacity = heat * 0.9;
    aura.style.opacity = heat * (0.75 + Math.sin(performance.now() / (260 - heat * 140)) * 0.25);
    if (alive && !frozen && !reduce) {
      if (runTier >= 2 && Math.random() < 0.08 * runTier) ember();
      if (runTier >= 4) vignette.style.filter = `hue-rotate(${(performance.now() / 30) % 360}deg)`;
      if (runTier >= 5 && Math.random() < 0.004) {
        $('flash').animate([{ opacity: 0.5 }, { opacity: 0 }, { opacity: 0.3 }, { opacity: 0 }], { duration: 260 });
        zap();
      }
    }
    requestAnimationFrame(heatLoop);
  }

  // whole stage jolts on each press once it's hot
  function kick(h, surge = 0) {
    if (!h || reduce) return;
    const m = h * h * 10 + surge * 14;
    stage.animate(
      [{ transform: `translate(${(Math.random() - 0.5) * m}px, ${(Math.random() - 0.5) * m}px)` }, { transform: 'none' }],
      { duration: 180, easing: 'cubic-bezier(0.23, 1, 0.32, 1)' }
    );
  }

  // ---- input ---------------------------------------------------------------
  const down = () => { if (alive) btn.classList.add('down'); };
  const up = () => btn.classList.remove('down');

  btn.addEventListener('pointerdown', e => { e.preventDefault(); unlockAudio(); down(); press(); });
  btn.addEventListener('pointerup', up);
  btn.addEventListener('pointerleave', up);
  btn.addEventListener('pointercancel', up);
  btn.addEventListener('click', e => { if (e.detail === 0) { unlockAudio(); press(); } }); // keyboard Enter

  let spaceHeld = false;
  window.addEventListener('keydown', e => {
    if (e.code !== 'Space' || e.target.closest('input')) return;
    e.preventDefault();
    if (over.classList.contains('show')) { reset(); return; }
    if (over.classList.contains('show') === false && !alive && !pendingDeath) return;
    if (spaceHeld) return;           // no autorepeat — every press is a choice
    spaceHeld = true;
    unlockAudio(); down(); press();
  });
  window.addEventListener('keyup', e => { if (e.code === 'Space') { spaceHeld = false; up(); } });

  $('again').addEventListener('click', reset);

  // ---- sound ----------------------------------------------------------------
  let ac = null;
  function unlockAudio() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { ac = null; } }
    if (ac && ac.state === 'suspended') ac.resume();
  }
  // major pentatonic climbing; wraps up an octave so long runs stay musical

      }
      cx.arc(p.x * dpr, p.y * dpr, p.r * dpr * (0.4 + 0.6 * k), 0, Math.PI * 2);
      cx.fill();
    }
    cx.globalAlpha = 1;
    timeScale += (1 - timeScale) * 0.025;
    raf = parts.length ? requestAnimationFrame(tick) : 0;
  }

  // ---- multiplayer ----------------------------------------------------------
  // star topology over WebRTC (PeerJS). whoever claims the room id first is the hub and relays;
  // if the hub leaves, everyone races to claim it again.
  const ROOM_PREFIX = 'onemore-v1-';
  const CODE_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  const uid = Math.random().toString(36).slice(2, 10);
  const drawer = $('drawer'), nameEl = $('name'), codeEl = $('code'), statusEl = $('status');
  const playersEl = $('players'), badge = $('badge'), toastEl = $('toast');

  let peer = null, hubConn = null, isHub = false, room = null, leaving = false, reclaiming = false;
  const conns = new Map();      // hub only: peerId -> { conn, uid }
  const others = new Map();     // uid -> last state

  nameEl.value = store.get('onemore.name') || 'player ' + uid.slice(0, 3);
  nameEl.addEventListener('input', () => { store.set('onemore.name', nameEl.value.trim()); publish('name'); });
  codeEl.value = store.get('onemore.room') || '';
  codeEl.addEventListener('input', () => { codeEl.value = codeEl.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); });
  codeEl.addEventListener('keydown', e => { if (e.key === 'Enter') joinRoom(codeEl.value); });

  $('tab').addEventListener('click', () => drawer.classList.toggle('open'));
  $('join').addEventListener('click', () => joinRoom(codeEl.value));
  $('create').addEventListener('click', () => {
    let c = ''; for (let i = 0; i < 4; i++) c += CODE_CHARS[(Math.random() * CODE_CHARS.length) | 0];
    codeEl.value = c; joinRoom(c);
  });
  $('leave').addEventListener('click', leaveRoom);

  const myState = (ev, extra) => ({ t: 'state', uid, name: nameEl.value.trim() || 'anon', count, best, alive, tier: runTier, h: +heatFor(count).toFixed(2), ev, ...extra });

  function publish(ev, extra) {
    if (!room) return;
    const msg = myState(ev, extra);
    if (isHub) broadcast(msg);
    else if (hubConn && hubConn.open) hubConn.send(msg);
  }
  function broadcast(msg, exceptPeer) {
    for (const [pid, c] of conns) if (pid !== exceptPeer && c.conn.open) c.conn.send(msg);
  }

  function setStatus(html) { statusEl.innerHTML = html; }
  function setJoined(on) {
    $('joinBox').style.display = on ? 'none' : 'flex';
    $('leave').style.display = on ? 'block' : 'none';
  }

  function joinRoom(code) {
    code = (code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (code.length < 3) { setStatus('codes are 3–6 letters.'); return; }
    if (typeof Peer === 'undefined') { setStatus('couldn’t load the p2p library. offline?'); return; }
    teardown();
    leaving = false;
    room = code;
    store.set('onemore.room', code);
    setJoined(true);
    setStatus(`room <b>${code}</b> · connecting…`);
    claimHub();
  }

  function claimHub() {
    if (!room || leaving) return;
    const p = new Peer(ROOM_PREFIX + room.toLowerCase());
    peer = p;
    p.on('open', () => {
      if (peer !== p) return;
      isHub = true;
      setStatus(`room <b>${room}</b> · you’re hosting`);
      toast(conns.size || reclaiming ? `you’re now hosting ${room}` : `room ${room} created`, 'good');
      reclaiming = false;
      publish('hello');
    });
    p.on('connection', conn => {
      conn.on('data', msg => onHubData(conn, msg));
      conn.on('open', () => {
        // catch the newcomer up on everyone, including the hub
        conn.send(myState('hello'));
        for (const st of others.values()) conn.send({ ...st, ev: 'sync' });
      });
      conn.on('close', () => guestGone(conn));
      conns.set(conn.peer, { conn, uid: null, last: Date.now() });
    });
    p.on('error', err => {
      if (peer !== p) return;
      if (err.type === 'unavailable-id') { p.destroy(); joinAsGuest(); }
      else if (err.type === 'network' || err.type === 'server-error' || err.type === 'socket-error') {
        setStatus(`room <b>${room}</b> · can’t reach the matchmaker. retrying…`);
        toast('connection lost · retrying…', 'bad');
        p.destroy(); setTimeout(() => peer === p && claimHub(), 2500);
      }
    });
  }

  function guestGone(conn) {
    const c = conns.get(conn.peer);
    if (!c || c.conn !== conn) return;
    conns.delete(conn.peer);
    if (c.uid) { dropPlayer(c.uid); broadcast({ t: 'leave', uid: c.uid }); }
  }

  function onHubData(conn, msg) {
    const c = conns.get(conn.peer);
    if (c) c.last = Date.now();
    if (!msg || msg.t !== 'state') return;
    if (c) c.uid = msg.uid;
    onState(msg);
    broadcast(msg, conn.peer);
  }

  function joinAsGuest() {
    if (!room || leaving) return;
    isHub = false;
    const p = new Peer();
    peer = p;
    p.on('open', () => {
      if (peer !== p) return;
      const conn = p.connect(ROOM_PREFIX + room.toLowerCase(), { reliable: true });
      hubConn = conn;
      conn.on('open', () => {
        setStatus(`room <b>${room}</b> · connected`);
        toast(reclaiming ? `reconnected to ${room}` : `connected to ${room}`, 'good');
        reclaiming = false;
        publish('hello');
      });
      hubLast = Date.now();
      conn.on('data', msg => {
        hubLast = Date.now();
        if (msg && msg.t === 'state') onState(msg);
        else if (msg && msg.t === 'leave') dropPlayer(msg.uid);
      });
      conn.on('close', () => hubLost(p));
    });
    p.on('error', err => {
      if (peer !== p) return;
      if (err.type === 'peer-unavailable') hubLost(p);  // hub vanished between claim and connect
    });
  }

  // hub dropped: forget the room roster and race to become the new hub
  function hubLost(p) {
    if (peer !== p || leaving) return;
    p.destroy(); peer = null; hubConn = null;
    others.clear(); renderPlayers();
    setStatus(`room <b>${room}</b> · host left, reconnecting…`);
    toast('host disconnected · reconnecting…', 'bad');
    reclaiming = true;
    setTimeout(claimHub, 200 + Math.random() * 900);
  }

  function teardown() {
    if (peer) { const p = peer; peer = null; p.destroy(); }
    hubConn = null; isHub = false; conns.clear(); others.clear();
    renderPlayers();
  }
  function leaveRoom() {
    leaving = true; room = null;
    teardown();
    setJoined(false);
    setStatus('left the room.');
    toast('left the room');
  }
  addEventListener('beforeunload', () => { if (peer) peer.destroy(); });

  // heartbeat: closed tabs can leave a data channel looking open for ~30s, so watch for silence instead
  const BEAT = 2000, TIMEOUT = 7000;
  let hubLast = 0;
  setInterval(() => {
    if (!room || !peer) return;
    const now = Date.now();
    if (isHub) {
      broadcast({ t: 'ping' });
      for (const c of [...conns.values()]) if (now - c.last > TIMEOUT) { c.conn.close(); guestGone(c.conn); }
    } else if (hubConn && hubConn.open) {
      hubConn.send({ t: 'ping' });
      if (now - hubLast > TIMEOUT) hubLost(peer);
    }
  }, BEAT);

  // ---- roster ----------------------------------------------------------------
  const rows = new Map();   // uid -> li
  const ghosts = new Map(); // uid -> side button
  const ghostsEl = $('ghosts');
  function onState(st) {
    if (st.uid === uid) return;
    const prev = others.get(st.uid);
    others.set(st.uid, st);
    renderPlayers();
    const gh = ghosts.get(st.uid);
    if (gh) ghostFx(gh, st, prev);
    const li = rows.get(st.uid);
    if (!li) return;
    if (st.ev === 'press') {
      li.querySelector('.ct').animate(
        [{ transform: 'translateY(-4px) scale(1.15)' }, { transform: 'none' }],
        { duration: 220, easing: 'cubic-bezier(0.23, 1, 0.32, 1)' }
      );
      if (prev && prev.best > 0 && st.count === prev.best + 1) toast(`${st.name} is past their best (${prev.best})`, 'hot');
    } else if (st.ev === 'die') {
      li.animate(
        [{ transform: 'translateX(-6px)' }, { transform: 'translateX(5px)' }, { transform: 'translateX(-3px)' }, { transform: 'none' }],
        { duration: 320, easing: 'cubic-bezier(0.23, 1, 0.32, 1)' }
      );
      toast(st.record ? `${st.name} set a new best: ${st.count}` : `${st.name} is out at ${st.count}`, st.record ? 'hot' : '');
    } else if (st.ev === 'tier') {
      toast(`${st.name}: ${TIERS[st.tier - 1].name}`, 'hot');
    } else if (st.ev === 'hello' && !prev) {
      toast(`${st.name} connected`, 'good');
    }
  }
  function dropPlayer(id) {
    const st = others.get(id);
    if (!st) return;
    others.delete(id);
    toast(`${st.name} disconnected`, 'bad');
    renderPlayers();
  }

  // a friend's button mirrors their run: presses, heat, tiers, the fall. silent on purpose
  const EASE = 'cubic-bezier(0.23, 1, 0.32, 1)';
  function ghostOrigin(g) {
    const r = g.querySelector('.gbtn').getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2, rad: r.width / 2 };
  }
  function ghostFx(g, st, prev) {
    g.heat = st.alive ? (st.h || 0) : 0;
    if (reduce) return;
    const ct = g.querySelector('.gct'), h = st.h || 0, t = st.tier || 0;
    if (st.ev === 'press') {
      g.querySelector('.gbtn').animate([{ transform: 'translateY(-1px)' }, { transform: 'translateY(-9px)' }], { duration: 220, easing: EASE });
      ct.animate([{ transform: `translateY(${-3 - h * 8}px) scale(${1.12 + h * 0.25}) rotate(${(Math.random() - 0.5) * h * 14}deg)` }, { transform: 'none' }], { duration: 240, easing: EASE });
      spawn(6 + Math.round(h * h * 45) + t * 5, 2.2 + h * 3, ['#ff8a6b', '#ffd1a8', '#ff4b3e'], 30 + h * 20, 0.06, ghostOrigin(g));
      if (t >= 3) shockwave(t, g.querySelector('.gwell'));
      if (t >= 6) spawn(10, 5, ['#ff4b3e', '#ffd36b', '#6bd3ff', '#b26bff', '#6bff9e'], 60, 0.12, ghostOrigin(g));
    } else if (st.ev === 'tier' && t) {
      const nm = g.querySelector('.gname');
      nm.textContent = TIERS[t - 1].name;
      nm.style.color = 'var(--red-hi)';
      nm.animate([{ opacity: 0, transform: 'scale(0.9)', filter: 'blur(3px)' }, { opacity: 1, transform: 'none', filter: 'blur(0)' }], { duration: 300, easing: EASE });
      clearTimeout(g.tierTimer);
      g.tierTimer = setTimeout(() => { nm.textContent = st.name; nm.style.color = ''; }, 1800);
      spawn(20 + t * 12, 3 + t * 0.6, ['#ffd36b', '#ff8a6b', '#fff1c2', '#ff4b3e'], 60, 0.03, ghostOrigin(g));
    } else if (st.ev === 'die') {
      const d = prev && prev.best > 0 && st.count > prev.best ? (prev.h || 0.3) : Math.min(0.2, st.count / 150);
      const a = 5 + d * 14;
      g.animate([{ transform: `translateX(${-a}px)` }, { transform: `translateX(${a * 0.8}px)` }, { transform: `translateX(${-a * 0.4}px)` }, { transform: 'none' }], { duration: 320 + d * 400 });
      spawn(30 + Math.round(d * 100), 4 + d * 5, ['#5d544c', '#8a7b6b', '#ff4b3e'], 60 + d * 40, 0.18, ghostOrigin(g));
      if (d >= 0.15) ct.animate([
        { transform: 'none' },
        { transform: `translateY(${60 + d * 80}px) rotate(${(Math.random() < 0.5 ? -1 : 1) * (15 + d * 50)}deg)`, opacity: 0, offset: 0.7 },
        { transform: 'none', opacity: 0, offset: 0.85 },
        { transform: 'none', opacity: 1 }
      ], { duration: 1400 + d * 400, easing: 'cubic-bezier(0.5, 0, 0.9, 0.5)' });
    }
  }
  // heat jitter + glow on friends' numbers, same feel as yours, a size smaller
  function ghostLoop() {
    for (const g of ghosts.values()) {
      const h = reduce ? 0 : (g.heat || 0);
      const ct = g.querySelector('.gct'), cap = g.querySelector('.gcap');
      const amp = h * h * 4 + h;
      ct.style.translate = h ? `${(Math.random() - 0.5) * amp}px ${(Math.random() - 0.5) * amp}px` : '';
      ct.style.color = h ? `color-mix(in oklab, var(--ink), var(--red-hi) ${Math.round(h * 100)}%)` : '';
      ct.style.textShadow = h ? `0 0 ${h * 28}px rgba(255, 75, 62, ${h * 0.7})` : '';
      cap.style.boxShadow = h ? `0 0 ${10 + h * 30}px rgba(255, 75, 62, ${0.3 + h * 0.5})` : '';
      // the well's rim reads their best at a glance: dull for small, hot and blooming for big
      const lvl = Math.min(1, Math.log((g.best || 0) + 1) / Math.log(150));
      const col = `hsl(${30 - lvl * 70}, ${8 + lvl * 92}%, ${42 + lvl * 26}%)`;
      const well = g.querySelector('.gwell');
      well.style.boxShadow = `inset 0 3px 8px rgba(0,0,0,0.8), 0 0 0 ${2 + lvl * 2}px ${col}, 0 0 ${lvl * lvl * 36}px ${lvl * 6}px ${col}`;
      well.style.filter = lvl > 0.5 ? `contrast(${1 + (lvl - 0.5) * 0.6}) saturate(${1 + lvl})` : '';
      const sh = reduce || lvl < 0.6 ? 0 : (lvl - 0.6) * 3;
      well.style.translate = sh ? `${(Math.random() - 0.5) * sh}px ${(Math.random() - 0.5) * sh}px` : '';
    }
    requestAnimationFrame(ghostLoop);
  }
  ghostLoop();

  function renderGhosts(list) {
    const keep = new Set();
    for (const st of list) {
      keep.add(st.uid);
      let g = ghosts.get(st.uid);
      if (!g) {
        g = document.createElement('div');
        g.className = 'ghost';
        g.innerHTML = '<div class="gtip"></div><div class="gwell"><div class="gbtn"><span class="gcap"></span></div></div><div class="gname"></div><div class="gct"></div>';
        ghosts.set(st.uid, g);
        ghostsEl.appendChild(g);
        g.animate([{ opacity: 0, transform: 'scale(0.9)' }, {}], { duration: 300, easing: 'cubic-bezier(0.23, 1, 0.32, 1)' });
      }
      if (!g.tierTimer || g.querySelector('.gname').style.color === '') g.querySelector('.gname').textContent = st.name;
      g.querySelector('.gct').textContent = st.count;
      g.querySelector('.gtip').textContent = `best ${st.best}`;
      g.best = st.best;
      g.classList.toggle('out', !st.alive);
      g.classList.toggle('hot', st.alive && st.best > 0 && st.count > st.best);
    }
    for (const [id, g] of ghosts) if (!keep.has(id)) { g.remove(); ghosts.delete(id); }
  }

  function renderPlayers() {
    badge.textContent = others.size || '';
    renderGhosts(room ? [...others.values()] : []);
    const list = [...others.values()].sort((a, b) => (b.alive - a.alive) || (b.count - a.count));
    if (!room) { playersEl.innerHTML = ''; rows.clear(); return; }
    if (!list.length) {
      playersEl.innerHTML = '<li class="empty">nobody else here yet. send your friend the code.</li>';
      rows.clear(); return;
    }
    const keep = new Set();
    playersEl.querySelector('.empty')?.remove();
    for (const st of list) {
      keep.add(st.uid);
      let li = rows.get(st.uid);
      if (!li) {
        li = document.createElement('li');
        li.className = 'player';
        li.innerHTML = '<div class="nm"></div><div class="ct"></div><div class="sub"></div>';
        rows.set(st.uid, li);
      }
      li.querySelector('.nm').textContent = st.name;
      li.querySelector('.ct').textContent = st.count;
      li.querySelector('.sub').textContent = st.alive
        ? (st.count === 0 ? `best ${st.best} · ready` : st.tier ? `${TIERS[st.tier - 1].name} · best ${st.best}` : `best ${st.best}`)
        : `out at ${st.count} · best ${st.best}`;
      li.classList.toggle('out', !st.alive);
      li.classList.toggle('hot', st.alive && st.best > 0 && st.count > st.best);
      playersEl.appendChild(li);   // re-append keeps sort order
    }
    for (const [id, li] of rows) if (!keep.has(id)) { li.remove(); rows.delete(id); }
  }

  let toastTimer = 0;
  function toast(text, kind = '') {
    toastEl.className = 'toast ' + kind;
    void toastEl.offsetWidth;
    toastEl.textContent = text;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2400);
  }

  reset();
  heatLoop();

  // ?dev: jump ahead to preview deep tiers (risk is untouched)
  // ---- debug console API ------------------------------------------------------
  // open devtools and call e.g.  onemore.immortal(); onemore.to('event horizon')
  // any run touched by these is a debug run: its best and tiers are never saved
  const dbgTag = () => { debugRun = true; document.title = 'One More (debug)'; };
  window.onemore = {
    immortal(on = true) { immortal = on; if (on) dbgTag(); return `immortal ${on ? 'on' : 'off'}`; },
    skip(n = 10) { if (!alive) reset(); dbgTag(); count += Math.max(1, n) - 1; press(); return count; },
    to(tier) {                          // jump straight past your best to a tier, by name or number (1-based)
      const i = typeof tier === 'number' ? tier - 1 : TIERS.findIndex(t => t.name === String(tier).toLowerCase());
      if (i < 0 || i >= TIERS.length) return 'tiers: ' + TIERS.map(t => t.name).join(', ');
      if (!alive) reset();
      dbgTag();
      if (runBest <= 0) runBest = best = 1;
      const target = runBest + TIERS[i].at;
      if (count < target) { count = target - 1; press(); }
      return `${TIERS[i].name} at ${count}`;
    },
    risk(p) { if (p !== undefined) { risk = Math.min(MAX_RISK, Math.max(MIN_RISK, p)); dbgTag(); } return fmtPct(risk); },
    die() { if (alive) { alive = false; dbgTag(); die(drama(count)); } },
    help() { return 'onemore.immortal(on?), .skip(n), .to(name|number), .risk(p?), .die()'; }
  };
  window.__onemore = window.onemore;
})();
</script>
</body>
</html>
